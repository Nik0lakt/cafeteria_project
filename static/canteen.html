<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Терминал Кассира</title>
    <link rel="stylesheet" href="/static/terminal.css">
</head>
<body id="appBody">

    <div id="loginOverlay" class="overlay" style="display: flex; z-index: 99999;">
        <div class="modal-box">
            <h3 style="text-align:center;">Вход в терминал</h3>
            <input type="text" id="deskLoginInput" placeholder="Логин кассы (например: 123)">
            <button class="btn-black" onclick="login()">Открыть смену</button>
            <div id="loginError" style="color: #dc3545; margin-top:15px; text-align:center; display:none; font-weight: bold;">
                ❌ Касса не найдена
            </div>
        </div>
    </div>

    <div class="app-container">
        <div class="top-bar">
            <div class="top-bar-left">
                <h3 style="margin:0;">Касса</h3>
                <div class="desk-badge" id="cashDeskLabel">...</div>
                <div class="admin-badge edit-only">РЕЖИМ РЕДАКТОРА</div>
            </div>
            <div class="top-bar-right">
                <button class="btn-outline" id="settingsBtn" onclick="openAdminAuth()">⚙️ Настройки</button>
                <button class="btn-outline edit-only" style="color:#dc3545; border-color:#dc3545;" onclick="exitAdmin()">Выйти из настроек</button>
                <button class="btn-outline" onclick="logout()">🚪 Выход</button>
            </div>
        </div>

        <div class="work-area">
            <div class="catalog-area">
                <div class="category-tabs" id="categoriesBar"></div>
                <div class="product-grid" id="productsGrid"></div>
            </div>

            <div class="cart-area">
                <h3 style="margin:0; padding-bottom:15px; border-bottom:1px solid #eee;">Чек</h3>
                <div class="cart-items" id="cartItems"></div>
                <div class="total-amount" id="totalDisplay">0 ₽</div>
                <button class="btn-black" onclick="openModal('paymentMethodModal')" id="payBtn" disabled>ОПЛАТИТЬ</button>
            </div>
        </div>
    </div>

    <div id="adminAuthModal" class="overlay">
        <div class="modal-box">
            <h3>Доступ к настройкам</h3>
            <input type="password" id="adminPassInput" placeholder="Пароль кассы">
            <button class="btn-black" onclick="verifyAdmin()">Войти</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('adminAuthModal')">Отмена</button>
        </div>
    </div>

    <div id="productModal" class="overlay">
        <div class="modal-box">
            <h3 id="productModalTitle">Товар</h3>
            <input type="hidden" id="editProductId">
            <label>Название</label><input type="text" id="prodName">
            <label>Цена (₽)</label><input type="number" id="prodPrice">
            <button class="btn-black" onclick="saveProduct()">Сохранить</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('productModal')">Отмена</button>
        </div>
    </div>

    <div id="catModal" class="overlay">
        <div class="modal-box">
            <h3 id="catModalTitle">Вкладка</h3>
            <input type="hidden" id="editCatId">
            <input type="text" id="catNameInput" placeholder="Название вкладки">
            <button class="btn-black" onclick="saveCategory()">Сохранить</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('catModal')">Отмена</button>
        </div>
    </div>

    <div id="paymentMethodModal" class="overlay">
        <div class="modal-box">
            <h3 style="text-align:center;">Способ оплаты</h3>
            <button class="btn-method" onclick="processExternal('bank_card')">💳 Карта</button>
            <button class="btn-method" onclick="startInternal()">🥗 Лицо (Дотация)</button>
            <button class="btn-method" onclick="startCash()">💵 Наличные</button>
            <button class="btn-outline" style="width:100%;" onclick="closeModal('paymentMethodModal')">Отмена</button>
        </div>
    </div>

    <div id="cashModal" class="overlay">
        <div class="modal-box">
            <h3 style="text-align:center;">Наличные</h3>
            <div style="text-align:center; margin-bottom:20px;">К оплате: <b id="cashTotalDisp" style="font-size:24px;">0</b> ₽</div>
            <input type="number" id="cashReceived" placeholder="Получено ₽" oninput="calculateChange()">
            <div id="changeDisp" style="text-align:center; font-size:18px; margin-bottom:20px;"></div>
            <button class="btn-black" id="confirmCashBtn" onclick="processExternal('cash')" disabled>Пробить чек</button>
        </div>
    </div>

    <script>
// --- 1. АВТОРИЗАЦИЯ И ИНИЦИАЛИЗАЦИЯ ---
let cashDeskLogin = localStorage.getItem('cashDeskId');
let cashDeskDbId = localStorage.getItem('cashDeskDbId');
let isAdmin = false, categories = [], products = [], currentCatId = 0, cart = [], total = 0;

function checkAuth() {
    const overlay = document.getElementById('loginOverlay');
    if (cashDeskLogin && cashDeskDbId && cashDeskDbId !== "undefined" && cashDeskDbId !== "null") {
        overlay.style.display = 'none';
        document.body.classList.add('logged-in');
        initApp();
    } else {
        overlay.style.display = 'flex';
        document.body.classList.remove('logged-in');
    }
}
checkAuth();

async function login() {
    const loginVal = document.getElementById('deskLoginInput').value.trim();
    if(!loginVal) return;
    try {
        const res = await fetch('/api/verify_cash_desk', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ login: loginVal }) 
        });
        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('cashDeskId', data.login);
            localStorage.setItem('cashDeskDbId', data.id);
            location.reload();
        } else {
            document.getElementById('loginError').style.display = "block";
        }
    } catch(e) { alert("Ошибка связи с сервером"); }
}

function logout() { if(confirm("Закрыть смену?")) { localStorage.clear(); location.reload(); } }

async function initApp() {
    document.getElementById('cashDeskLabel').innerText = cashDeskLogin;
    await loadData();
}

async function loadData() {
    try {
        const [cRes, pRes] = await Promise.all([
            fetch(`/api/categories?cash_desk_login=${cashDeskLogin}`),
            fetch(`/api/products?cash_desk_login=${cashDeskLogin}`)
        ]);
        categories = await cRes.json();
        products = await pRes.json();
        renderCategories(); 
        renderProducts();
    } catch(e) { console.error("Ошибка загрузки данных", e); }
}

// --- 2. ОТРИСОВКА (RENDER) ---
function renderCategories() {
    const bar = document.getElementById('categoriesBar');
    let html = `<div class="cat-tab ${currentCatId === 0 ? 'active' : ''}" onclick="selectCat(0)">⭐ Избранное</div>`;
    categories.forEach(c => {
        html += `<div class="cat-tab ${currentCatId === c.id ? 'active' : ''}" onclick="selectCat(${c.id})">
            ${c.name}
            ${isAdmin ? `
                <div style="position:absolute; top:-10px; right:-10px; display:flex; gap:2px;">
                    <button class="delete-btn" style="background:#007bff; position:static;" onclick="event.stopPropagation(); openEditCat(${c.id}, '${c.name}')">✎</button>
                    <button class="delete-btn" style="position:static;" onclick="event.stopPropagation(); deleteCat(${c.id})">×</button>
                </div>` : ''}
        </div>`;
    });
    if (isAdmin) html += `<div class="cat-tab" style="border: 2px dashed #000;" onclick="openAddCat()">+ Вкладка</div>`;
    bar.innerHTML = html;
}

function renderProducts() {
    const grid = document.getElementById('productsGrid');
    let html = '';
    let favs = JSON.parse(localStorage.getItem('favs_' + cashDeskLogin) || '[]');
    let displayProducts = currentCatId === 0 ? products.filter(p => favs.includes(p.id)) : products.filter(p => p.category_id === currentCatId);

    displayProducts.forEach(p => {
        const isFav = favs.includes(p.id);
        html += `<div class="product-card" onclick="if(!isAdmin) addToCart(${p.id}, '${p.name}', ${p.price})">
            <button class="star-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav(${p.id})">★</button>
            ${isAdmin ? `
                <div style="position:absolute; top:-5px; right:-5px; display:flex; gap:2px;">
                    <button class="delete-btn" style="background:#007bff; position:static;" onclick="event.stopPropagation(); openEditProduct(${p.id}, '${p.name}', ${p.price})">✎</button>
                    <button class="delete-btn" style="position:static;" onclick="event.stopPropagation(); deleteProduct(${p.id})">×</button>
                </div>` : ''}
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price} ₽</div>
        </div>`;
    });
    if (isAdmin && currentCatId !== 0) html += `<div class="product-card" style="border: 2px dashed #ccc;" onclick="openAddProduct()">+ Товар</div>`;
    grid.innerHTML = html;
}

function selectCat(id) { currentCatId = id; renderCategories(); renderProducts(); }

// --- 3. АДМИН-ФУНКЦИИ ---
async function verifyAdmin() {
    const pwd = document.getElementById('adminPassInput').value;
    const res = await fetch('/api/verify_desk_password', { 
        method: 'POST', headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({ login: cashDeskLogin, password: pwd }) 
    });
    if (res.ok) {
        isAdmin = true;
        document.body.classList.add('edit-mode');
        closeModal('adminAuthModal'); renderCategories(); renderProducts();
    } else alert("Неверный пароль");
}

function exitAdmin() { 
    isAdmin = false; 
    document.body.classList.remove('edit-mode'); 
    renderCategories(); renderProducts(); 
}

function openAddCat() { document.getElementById('editCatId').value = ''; document.getElementById('catNameInput').value = ''; document.getElementById('catModalTitle').innerText='Новая вкладка'; openModal('catModal'); }
function openEditCat(id, name) { document.getElementById('editCatId').value = id; document.getElementById('catNameInput').value = name; document.getElementById('catModalTitle').innerText='Изменить вкладку'; openModal('catModal'); }

async function saveCategory() {
    const id = document.getElementById('editCatId').value;
    const name = document.getElementById('catNameInput').value.trim();
    
    // Берем ID кассы, который мы сохранили при входе в терминал
    const deskDbId = localStorage.getItem('cashDeskDbId');

    if (!name) return alert("Введите название вкладки!");
    if (!deskDbId || deskDbId === "null") {
        return alert("Ошибка: ID кассы не найден. Перезайдите в терминал.");
    }

    const method = id ? 'PUT' : 'POST';
    const url = id ? `/api/categories/${id}` : '/api/categories';

    // Формируем данные: имя + привязка к кассе
    const payload = { 
        name: name,
        cash_desk_id: parseInt(deskDbId) 
    };

    try {
        const res = await fetch(url, { 
            method: method, 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify(payload) 
        });

        if (res.ok) {
            closeModal('catModal');
            // Очищаем поле ввода, чтобы при следующем открытии оно было пустым
            document.getElementById('catNameInput').value = '';
            // Перезагружаем данные, чтобы новая вкладка появилась в меню
            await loadData();
        } else {
            const errorData = await res.json();
            alert("Ошибка сервера: " + (errorData.detail || "Не удалось сохранить"));
        }
    } catch (e) {
        console.error("Ошибка при сохранении категории:", e);
        alert("Ошибка сети");
    }
}

async function deleteCat(id) { if(confirm("Удалить вкладку?")) { await fetch(`/api/categories/${id}`, { method: 'DELETE' }); loadData(); } }

function openAddProduct() { document.getElementById('editProductId').value = ''; document.getElementById('prodName').value = ''; document.getElementById('prodPrice').value = ''; document.getElementById('productModalTitle').innerText = 'Новый товар'; openModal('productModal'); }
function openEditProduct(id, name, price) { document.getElementById('editProductId').value = id; document.getElementById('prodName').value = name; document.getElementById('prodPrice').value = price; document.getElementById('productModalTitle').innerText = 'Изменить товар'; openModal('productModal'); }

async function saveProduct() {
    const id = document.getElementById('editProductId').value;
    const name = document.getElementById('prodName').value.trim();
    const price = parseInt(document.getElementById('prodPrice').value);
    if(!name || !price) return;
    const data = { name, price, category_id: currentCatId, cash_desk_ids: [parseInt(cashDeskDbId)] };
    const method = id ? 'PUT' : 'POST';
    const url = id ? `/api/products/${id}` : '/api/products';
    await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
    closeModal('productModal'); loadData();
}
async function deleteProduct(id) { if(confirm("Удалить товар?")) { await fetch(`/api/products/${id}`, { method: 'DELETE' }); loadData(); } }

// --- 4. КОРЗИНА И ОПЛАТА ---
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function addToCart(id, name, price) {
    let item = cart.find(i => i.id === id);
    if (item) item.qty++; else cart.push({id, name, price, qty: 1});
    renderCart();
}

function removeFromCart(id) {
    let itemIndex = cart.findIndex(i => i.id === id);
    
    if (itemIndex !== -1) {
        if (cart[itemIndex].qty > 1) {
            // Если товара больше одного — просто уменьшаем количество на 1
            cart[itemIndex].qty--;
        } else {
            // Если остался последний — удаляем строку целиком
            cart.splice(itemIndex, 1);
        }
    }
    renderCart(); // Обновляем чек на экране
}

function renderCart() {
    const cont = document.getElementById('cartItems'); cont.innerHTML = ''; total = 0;
    cart.forEach((i, idx) => {
        total += i.price * i.qty;
        cont.innerHTML += `<div class="cart-item">
    	    <span>${i.name} (x${i.qty})</span>
    	    <span>${i.price * i.qty} ₽ 
                <button onclick="removeFromCart(${i.id})" style="border:none;background:none;color:red;cursor:pointer;font-weight:bold;padding:0 5px;">✕</button>
            </span>
        </div>`;
    });
    document.getElementById('totalDisplay').innerText = total + " ₽";
    document.getElementById('payBtn').disabled = cart.length === 0;
}

function toggleFav(id) {
    let favs = JSON.parse(localStorage.getItem('favs_' + cashDeskLogin) || '[]');
    favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
    localStorage.setItem('favs_' + cashDeskLogin, JSON.stringify(favs));
    renderProducts();
}

function startCash() { document.getElementById('cashTotalDisp').innerText = total; openModal('cashModal'); }
function calculateChange() {
    const rec = parseFloat(document.getElementById('cashReceived').value) || 0;
    const diff = rec - total;
    document.getElementById('changeDisp').innerHTML = diff >= 0 ? `Сдача: <b style="color:green">${diff} ₽</b>` : `Не хватает: <b style="color:red">${Math.abs(diff)} ₽</b>`;
    document.getElementById('confirmCashBtn').disabled = rec < total;
}

async function processExternal(method) {
    // Шлем на сервер только product_id и количество
    const items = cart.map(i => ({ product_id: i.id, quantity: i.qty }));
    try {
        const res = await fetch('/api/pay_external', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ 
                cash_desk_id: cashDeskLogin, 
                items: items, 
                payment_method: method 
            }) 
        });
        if(res.ok) {
            cart = []; renderCart(); 
            closeModal('cashModal'); closeModal('paymentMethodModal'); 
            alert("Оплата принята!");
        } else {
            alert("Ошибка при оплате");
        }
    } catch(e) { alert("Ошибка сети"); }
}

function startInternal() {
    if (cart.length === 0) return alert("Корзина пуста!");
    
    // Сохраняем товары (только ID и количество для "Стены")
    localStorage.setItem('pendingCart', JSON.stringify(cart.map(i => ({ product_id: i.id, quantity: i.qty }))));
    // Сохраняем общую сумму для красоты на экране оплаты
    localStorage.setItem('pendingAmount', total);
    
    window.location.href = 'index.html';
}

function openAdminAuth() { openModal('adminAuthModal'); }
    </script>
</body>
</html>
