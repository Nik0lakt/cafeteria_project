<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Терминал Кассира</title>
    <link rel="stylesheet" href="/static/terminal.css">
</head>
<body id="appBody">

    <div id="loginOverlay" class="overlay" style="display: flex;">
        <div class="modal-box">
            <h3 style="text-align:center;">Вход в терминал</h3>
            <input type="text" id="deskLoginInput" placeholder="Логин кассы (например: 123)">
            <button class="btn-black" onclick="login()">Открыть смену</button>
            <div id="loginError" style="color: #dc3545; margin-top:15px; text-align:center; display:none; font-weight: bold;">
                ❌ Касса не найдена
            </div>
        </div>
    </div>

    <div class="app-container">
        <div class="top-bar">
            <div class="top-bar-left">
                <h3 style="margin:0;">Cafeteria POS</h3>
                <div class="desk-badge" id="cashDeskLabel">...</div>
                <div class="admin-badge edit-only" id="adminBadge">РЕЖИМ РЕДАКТОРА</div>
            </div>
            <div class="top-bar-right">
                <button class="btn-outline" id="settingsBtn" onclick="openAdminAuth()">⚙️ Настройки</button>
                <button class="btn-outline edit-only" style="color:#dc3545; border-color:#dc3545;" onclick="exitAdmin()">Выйти из настроек</button>
                <button class="btn-outline" onclick="logout()">🚪 Выход</button>
            </div>
        </div>

        <div class="work-area">
            <div class="catalog-area">
                <div class="category-tabs" id="categoriesBar"></div>
                <div class="product-grid" id="productsGrid"></div>
            </div>

            <div class="cart-area">
                <h3 style="margin:0; padding-bottom:15px; border-bottom:1px solid #eee;">Чек</h3>
                <div class="cart-items" id="cartItems"></div>
                <div class="total-amount" id="totalDisplay">0 ₽</div>
                <button class="btn-black" onclick="openModal('paymentMethodModal')" id="payBtn" disabled>ОПЛАТИТЬ</button>
            </div>
        </div>
    </div>

    <div id="adminAuthModal" class="overlay">
        <div class="modal-box">
            <h3>Доступ к настройкам</h3>
            <input type="password" id="adminPassInput" placeholder="Пароль кассы">
            <button class="btn-black" onclick="verifyAdmin()">Войти</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('adminAuthModal')">Отмена</button>
        </div>
    </div>

    <div id="addCatModal" class="overlay">
        <div class="modal-box">
            <h3>Новая вкладка (Категория)</h3>
            <input type="text" id="newCatName" placeholder="Название (Напитки, Еда...)">
            <button class="btn-black" onclick="addCategory()">Создать</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('addCatModal')">Отмена</button>
        </div>
    </div>

    <div id="addProductModal" class="overlay">
        <div class="modal-box">
            <h3>Новый товар</h3>
            <label>Название</label><input type="text" id="newProdName">
            <label>Цена (₽)</label><input type="number" id="newProdPrice">
            <button class="btn-black" onclick="addProduct()">Сохранить товар</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('addProductModal')">Отмена</button>
        </div>
    </div>

    <div id="paymentMethodModal" class="overlay">
        <div class="modal-box">
            <h3 style="text-align:center;">Способ оплаты</h3>
            <button class="btn-method" onclick="processExternal('bank_card')"><span>💳</span> Карта</button>
            <button class="btn-method" onclick="startInternal()"><span>🥗</span> Лицо (Дотация)</button>
            <button class="btn-method" onclick="startCash()"><span>💵</span> Наличные</button>
            <button class="btn-outline" style="width:100%;" onclick="closeModal('paymentMethodModal')">Отмена</button>
        </div>
    </div>

    <div id="cashModal" class="overlay">
        <div class="modal-box">
            <h3 style="text-align:center;">Наличные</h3>
            <div style="text-align:center; margin-bottom:20px;">К оплате: <b id="cashTotalDisp" style="font-size:24px;">0</b> ₽</div>
            <input type="number" id="cashReceived" placeholder="Получено ₽" oninput="calculateChange()">
            <div id="changeDisp" style="text-align:center; font-size:18px; margin-bottom:20px;"></div>
            <button class="btn-black" id="confirmCashBtn" onclick="processExternal('cash')" disabled>Пробить чек</button>
        </div>
    </div>

    <script>
        let cashDeskLogin = localStorage.getItem('cashDeskId');
        let cashDeskDbId = localStorage.getItem('cashDeskDbId');
        let isAdmin = false, categories = [], products = [], currentCatId = 0, cart = [], total = 0;
        
        // Инициализация
        if (!cashDeskLogin || !cashDeskDbId) {
            document.getElementById('loginOverlay').style.display = 'flex';
        } else {
            document.getElementById('loginOverlay').style.display = 'none';
            document.body.classList.add('logged-in');
            initApp();
        }

        async function login() {
            const loginVal = document.getElementById('deskLoginInput').value.trim();
            if(!loginVal) return;
            const res = await fetch('/api/verify_cash_desk', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ login: loginVal }) 
            });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('cashDeskId', data.login);
                localStorage.setItem('cashDeskDbId', data.id); // Сохраняем ID из базы
                location.reload();
            } else {
                document.getElementById('loginError').style.display = "block";
            }
        }

        function logout() { if(confirm("Закрыть смену?")) { localStorage.clear(); location.reload(); } }

        async function initApp() {
            document.getElementById('cashDeskLabel').innerText = cashDeskLogin;
            await loadData();
        }

        async function loadData() {
            const [cRes, pRes] = await Promise.all([
                fetch('/api/categories'),
                fetch(`/api/products?cash_desk_login=${cashDeskLogin}`)
            ]);
            categories = await cRes.json();
            products = await pRes.json();
            renderCategories(); 
            renderProducts();
        }

        function renderCategories() {
            const bar = document.getElementById('categoriesBar');
            let html = `<div class="cat-tab ${currentCatId === 0 ? 'active' : ''}" onclick="selectCat(0)">⭐ Избранное</div>`;
            categories.forEach(c => {
                html += `<div class="cat-tab ${currentCatId === c.id ? 'active' : ''}" onclick="selectCat(${c.id})">
                    ${c.name}
                    ${isAdmin ? `<button class="delete-btn" onclick="event.stopPropagation(); deleteCat(${c.id})">×</button>` : ''}
                </div>`;
            });
            if (isAdmin) html += `<div class="cat-tab" style="border: 2px dashed #000;" onclick="openModal('addCatModal')">+ Вкладка</div>`;
            bar.innerHTML = html;
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            let html = '';
            let favs = JSON.parse(localStorage.getItem('favs_' + cashDeskLogin) || '[]');
            let displayProducts = currentCatId === 0 ? products.filter(p => favs.includes(p.id)) : products.filter(p => p.category_id === currentCatId);

            displayProducts.forEach(p => {
                const isFav = favs.includes(p.id);
                html += `<div class="product-card" onclick="if(!isAdmin) addToCart('${p.name}', ${p.price})">
                    <button class="star-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav(${p.id})">★</button>
                    ${isAdmin ? `<button class="delete-btn" onclick="event.stopPropagation(); deleteProduct(${p.id})">×</button>` : ''}
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price} ₽</div>
                </div>`;
            });
            if (isAdmin && currentCatId !== 0) html += `<div class="product-card" style="border: 2px dashed #ccc;" onclick="openModal('addProductModal')">+ Добавить</div>`;
            grid.innerHTML = html;
        }

        function selectCat(id) { currentCatId = id; renderCategories(); renderProducts(); }
        
        function toggleFav(id) {
            let favs = JSON.parse(localStorage.getItem('favs_' + cashDeskLogin) || '[]');
            favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
            localStorage.setItem('favs_' + cashDeskLogin, JSON.stringify(favs));
            renderProducts();
        }

        // РЕЖИМ РЕДАКТОРА
        async function openAdminAuth() { openModal('adminAuthModal'); }
        async function verifyAdmin() {
            const pwd = document.getElementById('adminPassInput').value;
            const res = await fetch('/api/verify_desk_password', { 
                method: 'POST', headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ login: cashDeskLogin, password: pwd }) 
            });
            if (res.ok) {
                isAdmin = true;
                document.body.classList.add('edit-mode'); // Активируем CSS правила
                closeModal('adminAuthModal'); renderCategories(); renderProducts();
            } else alert("Ошибка пароля");
        }

        function exitAdmin() { 
            isAdmin = false; 
            document.body.classList.remove('edit-mode'); // Прячем админ-кнопки через CSS
            renderCategories(); renderProducts(); 
        }

        // СОЗДАНИЕ КАТЕГОРИИ
        async function addCategory() {
            const name = document.getElementById('newCatName').value.trim();
            if(!name) return;
            await fetch('/api/categories', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name }) });
            closeModal('addCatModal'); document.getElementById('newCatName').value = ''; loadData();
        }

        async function deleteCat(id) {
            if(confirm("Удалить вкладку?")) {
                await fetch(`/api/categories/${id}`, { method: 'DELETE' });
                currentCatId = 0; loadData();
            }
        }

        // --- САМАЯ ВАЖНАЯ ФУНКЦИЯ: СОЗДАНИЕ ТОВАРА ---
        async function addProduct() {
            const name = document.getElementById('newProdName').value.trim();
            const price = parseInt(document.getElementById('newProdPrice').value);
            if(!name || !price) { alert("Заполните имя и цену!"); return; }

            const data = {
                name: name,
                price: price,
                category_id: currentCatId,
                cash_desk_ids: [parseInt(cashDeskDbId)] // Отправляем числовой ID этой кассы
            };

            const res = await fetch('/api/products', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(data) 
            });

            if(res.ok) {
                closeModal('addProductModal'); 
                document.getElementById('newProdName').value = ''; 
                document.getElementById('newProdPrice').value = '';
                await loadData(); // Обновляем список
            } else {
                const err = await res.json();
                alert("Ошибка сохранения: " + JSON.stringify(err.detail));
            }
        }

        async function deleteProduct(id) {
            if(confirm("Удалить товар?")) {
                await fetch(`/api/products/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        // КОРЗИНА И ОПЛАТА
        function addToCart(name, price) {
            let item = cart.find(i => i.name === name);
            if (item) item.qty++; else cart.push({name, price, qty: 1});
            renderCart();
        }

        function renderCart() {
            const cont = document.getElementById('cartItems'); cont.innerHTML = ''; total = 0;
            cart.forEach((i, idx) => {
                total += i.price * i.qty;
                cont.innerHTML += `<div class="cart-item">
                    <span>${i.name} (x${i.qty})</span>
                    <span>${i.price * i.qty} ₽ <button onclick="cart.splice(${idx},1);renderCart()" style="border:none;background:none;color:red;cursor:pointer;">✕</button></span>
                </div>`;
            });
            document.getElementById('totalDisplay').innerText = total + " ₽";
            document.getElementById('payBtn').disabled = cart.length === 0;
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function startCash() { document.getElementById('cashTotalDisp').innerText = total; openModal('cashModal'); }
        function calculateChange() {
            const rec = parseFloat(document.getElementById('cashReceived').value) || 0;
            const diff = rec - total;
            document.getElementById('changeDisp').innerHTML = diff >= 0 ? `Сдача: <b style="color:green">${diff} ₽</b>` : `Не хватает: <b style="color:red">${Math.abs(diff)} ₽</b>`;
            document.getElementById('confirmCashBtn').disabled = rec < total;
        }

        async function processExternal(method) {
            let items = []; cart.forEach(i => { for(let k=0; k<i.qty; k++) items.push({name:i.name, price:i.price}) });
            await fetch('/api/pay_external', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ cash_desk_id: cashDeskLogin, amount_rub: total, items: items, payment_method: method }) });
            cart = []; renderCart(); closeModal('cashModal'); closeModal('paymentMethodModal'); alert("Успешно!");
        }

        function startInternal() { window.location.href = `index.html?amount=${total}&desk=${cashDeskLogin}`; }
    </script>
</body>
</html>
