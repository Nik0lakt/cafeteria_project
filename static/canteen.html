<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <title>Терминал Кассира | Cafeteria</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2196F3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/terminal.css">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body id="appBody">

    <!-- Экран входа в смену -->
    <div id="loginOverlay" class="overlay" style="display: flex; z-index: 99999;">
        <div class="modal-box">
            <div style="text-align:center; margin-bottom:16px;"><i class="ph-bold ph-fork-knife" style="font-size:36px; color:var(--primary);"></i></div>
            <h3>Открыть смену</h3>
            <input type="text" id="cashierLoginInput" placeholder="Ваш логин кассира...">
            <input type="text" id="deskLoginInput" placeholder="Логин терминала...">
            <button class="btn-black" onclick="login()">Начать работу</button>
            <div id="loginError" style="color: #EF4444; margin-top:12px; text-align:center; display:none; font-size:14px; font-weight:600;">
                Ошибка входа. Проверьте логины.
            </div>
        </div>
    </div>

    <div class="app-container">
        <div class="top-bar">
            <div class="top-bar-left">
                <h3><i class="ph-bold ph-fork-knife"></i> Cafeteria</h3>
                <div class="desk-badge" id="cashDeskLabel">...</div>
                <div class="desk-badge" id="cashierLabel" style="background:rgba(167,139,250,0.18); color:#7C3AED; display:none;"></div>
                <div class="admin-badge edit-only">РЕЖИМ НАСТРОЙКИ</div>
            </div>
            <div class="top-bar-right">
                <button class="btn-outline" id="shiftSummaryBtn" onclick="openShiftSummary()" style="display:none"><i class="ph-bold ph-chart-bar"></i> Итоги смены</button>
                <button class="btn-outline" id="settingsBtn" onclick="openAdminAuth()"><i class="ph-bold ph-gear"></i> Настройки</button>
                <button class="btn-outline edit-only" style="color:#EF4444; border-color:#EF4444;" onclick="exitAdmin()">Выйти из настроек</button>
                <button class="btn-outline" onclick="logout()"><i class="ph-bold ph-sign-out"></i> Закрыть смену</button>
            </div>
        </div>

        <div class="work-area">
            <div class="catalog-area">
                <div class="category-tabs" id="categoriesBar"></div>
                <div class="product-grid" id="productsGrid"></div>
            </div>

            <div class="cart-area">
                <h3 style="margin:0; padding-bottom:14px; border-bottom:1px solid var(--border); margin-bottom:0;">Заказ</h3>
                <div class="cart-items" id="cartItems"></div>
                <div class="total-amount" id="totalDisplay">0 ₽</div>
                <button class="btn-black" onclick="openModal('paymentMethodModal')" id="payBtn" disabled>ОПЛАТИТЬ</button>
            </div>
        </div>
    </div>

    <!-- Модал: Вход в настройки -->
    <div id="adminAuthModal" class="overlay">
        <div class="modal-box">
            <h3>Вход в настройки</h3>
            <input type="password" id="adminPassInput" placeholder="Пароль кассы">
            <button class="btn-black" onclick="verifyAdmin()">Войти</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('adminAuthModal')">Отмена</button>
        </div>
    </div>

    <!-- Модал: Товар -->
    <div id="productModal" class="overlay">
        <div class="modal-box">
            <h3 id="productModalTitle">Товар</h3>
            <input type="hidden" id="editProductId">
            <label>Название</label><input type="text" id="prodName" placeholder="Название блюда">
            <label>Цена, ₽</label><input type="number" id="prodPrice" placeholder="0">
            <button class="btn-black" onclick="saveProduct()">Сохранить</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('productModal')">Отмена</button>
        </div>
    </div>

    <!-- Модал: Категория -->
    <div id="catModal" class="overlay">
        <div class="modal-box">
            <h3 id="catModalTitle">Вкладка</h3>
            <input type="hidden" id="editCatId">
            <input type="text" id="catNameInput" placeholder="Название вкладки...">
            <button class="btn-black" onclick="saveCategory()">Сохранить</button>
            <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('catModal')">Отмена</button>
        </div>
    </div>

    <!-- Модал: Способ оплаты -->
    <div id="paymentMethodModal" class="overlay">
        <div class="modal-box">
            <h3>Способ оплаты</h3>
            <button class="btn-method" onclick="processExternal('bank_card')"><i class="ph-bold ph-credit-card" style="font-size:20px;"></i> Банковская карта</button>
            <button class="btn-method" onclick="startInternal()"><i class="ph-bold ph-scan-smiley" style="font-size:20px;"></i> Дотация (распознавание лица)</button>
            <button class="btn-method" onclick="startCash()"><i class="ph-bold ph-money" style="font-size:20px;"></i> Наличные</button>
            <button class="btn-outline" style="width:100%; margin-top:4px;" onclick="closeModal('paymentMethodModal')">Отмена</button>
        </div>
    </div>

    <!-- Модал: Наличные -->
    <div id="cashModal" class="overlay">
        <div class="modal-box">
            <h3>Оплата наличными</h3>
            <div style="text-align:center; margin-bottom:16px; font-size:14px; color:#6B7280;">К оплате: <b id="cashTotalDisp" style="font-size:26px; color:#111827; display:block; margin-top:4px;">0 ₽</b></div>
            <input type="number" id="cashReceived" placeholder="Сумма от покупателя, ₽" oninput="calculateChange()">
            <div id="changeDisp" style="text-align:center; font-size:18px; margin-bottom:16px; font-weight:600;"></div>
            <button class="btn-black" id="confirmCashBtn" onclick="processExternal('cash')" disabled>Принять оплату</button>
        </div>
    </div>

    <div id="shiftSummaryModal" class="overlay">
        <div class="modal-box">
            <h3>Итоги смены</h3>
            <div id="shiftSummaryContent" style="font-size:14px;">Загрузка...</div>
            <button class="btn-outline" style="width:100%; margin-top:14px;" onclick="closeModal('shiftSummaryModal')">Закрыть</button>
        </div>
    </div>

    <script>
// --- 1. АВТОРИЗАЦИЯ И ИНИЦИАЛИЗАЦИЯ ---
let cashDeskLogin = localStorage.getItem('cashDeskId');
let cashDeskDbId = localStorage.getItem('cashDeskDbId');
let cashierName   = localStorage.getItem('cashierName');
let isAdmin = false, categories = [], products = [], currentCatId = 0, cart = [], total = 0;

function checkAuth() {
    const overlay = document.getElementById('loginOverlay');
    if (cashDeskLogin && cashDeskDbId && cashDeskDbId !== "undefined" && cashDeskDbId !== "null") {
        overlay.style.display = 'none';
        document.body.classList.add('logged-in');
        document.getElementById('shiftSummaryBtn').style.display = '';
        initApp();
    } else {
        overlay.style.display = 'flex';
        document.body.classList.remove('logged-in');
        document.getElementById('shiftSummaryBtn').style.display = 'none';
    }
}
checkAuth();

async function login() {
    const deskVal     = document.getElementById('deskLoginInput').value.trim();
    const cashierVal  = document.getElementById('cashierLoginInput').value.trim();
    if (!deskVal) return;
    document.getElementById('loginError').style.display = 'none';
    try {
        const res = await fetch('/api/verify_cash_desk', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ login: deskVal, cashier_login: cashierVal })
        });
        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('cashDeskId',   data.login);
            localStorage.setItem('cashDeskDbId', data.id);
            localStorage.setItem('cashierName',  data.cashier_name || '');
            localStorage.setItem('shiftStart',   new Date().toISOString());
            location.reload();
        } else {
            const err = await res.json().catch(() => ({}));
            const errEl = document.getElementById('loginError');
            errEl.innerText = err.detail || 'Ошибка входа. Проверьте логины.';
            errEl.style.display = 'block';
        }
    } catch(e) { alert("Ошибка связи с сервером"); }
}

function logout() { if(confirm("Закрыть смену?")) { localStorage.clear(); location.reload(); } }

async function initApp() {
    document.getElementById('cashDeskLabel').innerText = cashDeskLogin;
    const cashierBadge = document.getElementById('cashierLabel');
    if (cashierName) {
        cashierBadge.innerText = cashierName;
        cashierBadge.style.display = 'inline-flex';
    }
    await loadData();
    startHeartbeat();
}

function startHeartbeat() {
    const ping = () => fetch('/api/terminals/ping', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: cashDeskLogin })
    }).catch(() => {});
    ping(); // immediate first ping
    setInterval(ping, 60000);
}

async function loadData() {
    try {
        const [cRes, pRes] = await Promise.all([
            fetch(`/api/categories?cash_desk_login=${cashDeskLogin}`),
            fetch(`/api/products?cash_desk_login=${cashDeskLogin}`)
        ]);
        categories = await cRes.json();
        products = await pRes.json();
        // Open first category by default instead of empty Favourites tab
        if (currentCatId === 0 && categories.length > 0) {
            currentCatId = categories[0].id;
        }
        renderCategories();
        renderProducts();
    } catch(e) { console.error("Ошибка загрузки данных", e); }
}

// --- 2. ОТРИСОВКА (RENDER) ---
function renderCategories() {
    const bar = document.getElementById('categoriesBar');
    let html = `<div class="cat-tab ${currentCatId === 0 ? 'active' : ''}" onclick="selectCat(0)"><i class="ph-bold ph-star"></i> Избранное</div>`;
    categories.forEach(c => {
        html += `<div class="cat-tab ${currentCatId === c.id ? 'active' : ''}" onclick="selectCat(${c.id})">
            ${c.name}
            ${isAdmin ? `
                <div style="position:absolute; top:-10px; right:-10px; display:flex; gap:2px;">
                    <button class="delete-btn" style="background:#3B82F6; position:static;" onclick="event.stopPropagation(); openEditCat(${c.id}, '${c.name}')"><i class="ph-bold ph-pencil-simple"></i></button>
                    <button class="delete-btn" style="position:static;" onclick="event.stopPropagation(); deleteCat(${c.id})"><i class="ph-bold ph-x"></i></button>
                </div>` : ''}
        </div>`;
    });
    if (isAdmin) html += `<div class="cat-tab" style="border: 2px dashed var(--border); color:var(--text-muted);" onclick="openAddCat()">+ Раздел</div>`;
    bar.innerHTML = html;
}

function renderProducts() {
    const grid = document.getElementById('productsGrid');
    let html = '';
    let favs = JSON.parse(localStorage.getItem('favs_' + cashDeskLogin) || '[]');
    let displayProducts = currentCatId === 0 ? products.filter(p => favs.includes(p.id)) : products.filter(p => p.category_id === currentCatId);

    displayProducts.forEach(p => {
        const isFav = favs.includes(p.id);
        html += `<div class="product-card" onclick="if(!isAdmin) addToCart(${p.id}, '${p.name}', ${p.price})">
            <button class="star-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav(${p.id})"><i class="${isFav ? 'ph-fill' : 'ph'} ph-star"></i></button>
            ${isAdmin ? `
                <div style="position:absolute; top:-5px; right:-5px; display:flex; gap:2px;">
                    <button class="delete-btn" style="background:#3B82F6; position:static;" onclick="event.stopPropagation(); openEditProduct(${p.id}, '${p.name}', ${p.price})"><i class="ph-bold ph-pencil-simple"></i></button>
                    <button class="delete-btn" style="position:static;" onclick="event.stopPropagation(); deleteProduct(${p.id})"><i class="ph-bold ph-x"></i></button>
                </div>` : ''}
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price} ₽</div>
        </div>`;
    });
    if (isAdmin && currentCatId !== 0) html += `<div class="product-card" style="border: 2px dashed var(--border); color:var(--text-muted);" onclick="openAddProduct()">+ Блюдо</div>`;
    grid.innerHTML = html;
}

function selectCat(id) { currentCatId = id; renderCategories(); renderProducts(); }

// --- 3. АДМИН-ФУНКЦИИ ---
async function verifyAdmin() {
    const pwd = document.getElementById('adminPassInput').value;
    const res = await fetch('/api/verify_desk_password', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ login: cashDeskLogin, password: pwd })
    });
    if (res.ok) {
        isAdmin = true;
        document.body.classList.add('edit-mode');
        closeModal('adminAuthModal'); renderCategories(); renderProducts();
    } else alert("Неверный пароль");
}

function exitAdmin() {
    isAdmin = false;
    document.body.classList.remove('edit-mode');
    renderCategories(); renderProducts();
}

function openAddCat() { document.getElementById('editCatId').value = ''; document.getElementById('catNameInput').value = ''; document.getElementById('catModalTitle').innerText='Новый раздел'; openModal('catModal'); }
function openEditCat(id, name) { document.getElementById('editCatId').value = id; document.getElementById('catNameInput').value = name; document.getElementById('catModalTitle').innerText='Изменить раздел'; openModal('catModal'); }

async function saveCategory() {
    const id = document.getElementById('editCatId').value;
    const name = document.getElementById('catNameInput').value.trim();

    // Берем ID кассы, который мы сохранили при входе в терминал
    const deskDbId = localStorage.getItem('cashDeskDbId');

    if (!name) return alert("Введите название вкладки!");
    if (!deskDbId || deskDbId === "null") {
        return alert("Ошибка: ID кассы не найден. Перезайдите в терминал.");
    }

    const method = id ? 'PUT' : 'POST';
    const url = id ? `/api/categories/${id}` : '/api/categories';

    // Формируем данные: имя + привязка к кассе
    const payload = {
        name: name,
        cash_desk_id: parseInt(deskDbId)
    };

    try {
        const res = await fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            closeModal('catModal');
            // Очищаем поле ввода, чтобы при следующем открытии оно было пустым
            document.getElementById('catNameInput').value = '';
            // Перезагружаем данные, чтобы новая вкладка появилась в меню
            await loadData();
        } else {
            const errorData = await res.json();
            alert("Ошибка сервера: " + (errorData.detail || "Не удалось сохранить"));
        }
    } catch (e) {
        console.error("Ошибка при сохранении категории:", e);
        alert("Ошибка сети");
    }
}

async function deleteCat(id) { if(confirm("Удалить раздел и все блюда в нём?")) { await fetch(`/api/categories/${id}`, { method: 'DELETE' }); loadData(); } }

function openAddProduct() { document.getElementById('editProductId').value = ''; document.getElementById('prodName').value = ''; document.getElementById('prodPrice').value = ''; document.getElementById('productModalTitle').innerText = 'Новое блюдо'; openModal('productModal'); }
function openEditProduct(id, name, price) { document.getElementById('editProductId').value = id; document.getElementById('prodName').value = name; document.getElementById('prodPrice').value = price; document.getElementById('productModalTitle').innerText = 'Изменить блюдо'; openModal('productModal'); }

async function saveProduct() {
    const id = document.getElementById('editProductId').value;
    const name = document.getElementById('prodName').value.trim();
    const price = parseInt(document.getElementById('prodPrice').value);
    if(!name || !price) return;
    const data = { name, price, category_id: currentCatId, cash_desk_ids: [parseInt(cashDeskDbId)] };
    const method = id ? 'PUT' : 'POST';
    const url = id ? `/api/products/${id}` : '/api/products';
    await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
    closeModal('productModal'); loadData();
}
async function deleteProduct(id) { if(confirm("Удалить блюдо?")) { await fetch(`/api/products/${id}`, { method: 'DELETE' }); loadData(); } }

// --- 4. КОРЗИНА И ОПЛАТА ---
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function addToCart(id, name, price) {
    let item = cart.find(i => i.id === id);
    if (item) item.qty++; else cart.push({id, name, price, qty: 1});
    renderCart();
}

function removeFromCart(id) {
    let itemIndex = cart.findIndex(i => i.id === id);

    if (itemIndex !== -1) {
        if (cart[itemIndex].qty > 1) {
            // Если товара больше одного — просто уменьшаем количество на 1
            cart[itemIndex].qty--;
        } else {
            // Если остался последний — удаляем строку целиком
            cart.splice(itemIndex, 1);
        }
    }
    renderCart(); // Обновляем чек на экране
}

function renderCart() {
    const cont = document.getElementById('cartItems'); cont.innerHTML = ''; total = 0;
    cart.forEach((i, idx) => {
        total += i.price * i.qty;
        cont.innerHTML += `<div class="cart-item">
    	    <span>${i.name} (x${i.qty})</span>
    	    <span>${i.price * i.qty} ₽
                <button onclick="removeFromCart(${i.id})" style="border:none;background:none;color:#EF4444;cursor:pointer;padding:0 5px;display:inline-flex;align-items:center;"><i class="ph-bold ph-x"></i></button>
            </span>
        </div>`;
    });
    document.getElementById('totalDisplay').innerText = total + " ₽";
    document.getElementById('payBtn').disabled = cart.length === 0;
}

function toggleFav(id) {
    let favs = JSON.parse(localStorage.getItem('favs_' + cashDeskLogin) || '[]');
    favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
    localStorage.setItem('favs_' + cashDeskLogin, JSON.stringify(favs));
    renderProducts();
}

function startCash() { document.getElementById('cashTotalDisp').innerText = total + ' ₽'; openModal('cashModal'); }
function calculateChange() {
    const rec = parseFloat(document.getElementById('cashReceived').value) || 0;
    const diff = rec - total;
    document.getElementById('changeDisp').innerHTML = diff >= 0 ? `Сдача: <span style="color:#22C55E">${diff} ₽</span>` : `Не хватает: <span style="color:#EF4444">${Math.abs(diff)} ₽</span>`;
    document.getElementById('confirmCashBtn').disabled = rec < total;
}

async function processExternal(method) {
    // Шлем на сервер только product_id и количество
    const items = cart.map(i => ({ product_id: i.id, quantity: i.qty }));
    try {
        const res = await fetch('/api/pay_external', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                cash_desk_id: cashDeskLogin,
                items: items,
                payment_method: method
            })
        });
        if(res.ok) {
            cart = []; renderCart();
            closeModal('cashModal'); closeModal('paymentMethodModal');
            alert("Оплата принята!");
        } else {
            alert("Ошибка при оплате");
        }
    } catch(e) { alert("Ошибка сети"); }
}

function startInternal() {
    if (cart.length === 0) return alert("Корзина пуста!");

    // Сохраняем товары (только ID и количество для "Стены")
    localStorage.setItem('pendingCart', JSON.stringify(cart.map(i => ({ product_id: i.id, quantity: i.qty }))));
    // Сохраняем общую сумму для красоты на экране оплаты
    localStorage.setItem('pendingAmount', total);

    window.location.href = 'index.html';
}

function openAdminAuth() { openModal('adminAuthModal'); }

async function openShiftSummary() {
    openModal('shiftSummaryModal');
    const since = localStorage.getItem('shiftStart') || new Date().toISOString();
    const params = new URLSearchParams({ desk: cashDeskLogin, since });
    try {
        const res = await fetch(`/api/terminals/shift_summary?${params}`);
        const d = await res.json();
        const methodNames = { bank_card: 'Карта', cash: 'Наличные', internal: 'Дотация', unknown: 'Другое' };
        let methods = Object.entries(d.by_method).map(([m, v]) =>
            `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f4f6;"><span>${methodNames[m]||m}</span><span>${v.count} оп. / ${v.total_rub} ₽</span></div>`
        ).join('');
        document.getElementById('shiftSummaryContent').innerHTML = `
          <div style="display:flex;justify-content:space-between;padding:8px 0;"><span>Транзакций</span><b>${d.count}</b></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;"><span>Выручка</span><b>${d.total_rub} ₽</b></div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;"><span>Средний чек</span><b>${d.avg_rub} ₽</b></div>
          <hr style="border:0;border-top:1px solid #e5e7eb;margin:10px 0;">
          <div style="font-weight:600;margin-bottom:6px;font-size:13px;">По методам оплаты:</div>
          ${methods || '<div style="color:#9ca3af;text-align:center;">Нет данных</div>'}`;
    } catch(e) {
        document.getElementById('shiftSummaryContent').innerHTML = '<div style="color:#EF4444;">Ошибка загрузки</div>';
    }
}

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }
    </script>
</body>
</html>
