[project]
name = "cafeteria"
version = "1.0.0"
description = "Corporate cafeteria management system with biometric authentication"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B"]
ignore = ["S101", "S105", "S106", "S110", "S310", "B008", "B904", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E402"]
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
